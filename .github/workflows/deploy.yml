name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Resized WebP copies of the photos (scripts/optimize-images.mjs) are kept between runs.
      - uses: actions/cache@v4
        with:
          path: public/_img
          key: img-${{ hashFiles('public/uploads/**', 'public/images/**', 'scripts/optimize-images.mjs') }}
          restore-keys: img-
      - run: npm run check:content
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # The on-site photo editor commits to this repository.
          PUBLIC_GITHUB_REPO: ${{ github.repository }}
          # Where the lead forms send their data (Settings → Secrets and variables → Actions → Variables).
          # Empty = the forms are replaced by call / Zalo / email buttons.
          PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
