# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Generated once from the page content files; edit by hand from now on.
media:
  input: public/uploads
  output: /uploads
settings:
  content:
    merge: true
components:
  photo:
    type: object
    fields:
    - name: src
      label: Ảnh
      type: image
      description: 'Cách dễ nhất: thay và căn ảnh ngay trên website — mở https://ducminhnguyenvietnam-sketch.github.io/tien-nong-group-website/?sua-anh
        rồi bấm vào ảnh. Hoặc tải ảnh lên tại đây.'
    - name: focus
      label: Điểm căn ảnh
      type: string
      default: center
      description: 'Do chế độ sửa ảnh trên website tự điền (ví dụ "40% 25%"). Có thể ghi: center, top, bottom, left, right.'
    - name: zoom
      label: Phóng to (%)
      type: string
      default: '100'
      description: 100 = không phóng. Do chế độ sửa ảnh trên website tự điền.
    - name: alt
      label: Mô tả ảnh
      type: string
      description: Một câu mô tả nội dung ảnh (cho Google và người khiếm thị).
content:
- name: news
  label: Tin tức – bài viết
  type: collection
  path: src/content/news
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - category
    - date
    primary: title
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Tiêu đề
    type: string
    required: true
  - name: category
    label: Chuyên mục
    type: select
    required: true
    default: tn
    options:
      values:
      - value: tn
        label: Tin Tiến Nông
      - value: khcn
        label: Khoa học & Công nghệ
      - value: kt
        label: Kiến thức nông nghiệp
      - value: nd
        label: Nông dân & Mô hình hiệu quả
      - value: cd
        label: Tiến Nông vì cộng đồng & ESG
      - value: bc
        label: Báo chí nói về Tiến Nông
  - name: date
    label: Ngày đăng
    type: date
    description: Bài mới nhất hiện trước.
  - name: author
    label: Tác giả
    type: string
    default: Phòng Truyền thông
  - name: featured
    label: Ghim làm tin nổi bật
    type: boolean
    description: Tin nổi bật hiện ô lớn đầu trang Tin tức.
  - name: summary
    label: Tóm tắt (sapo)
    type: text
    description: Hiện ở danh sách tin và in đậm ở đầu bài.
  - name: cover
    label: Ảnh đại diện
    component: photo
    description: Bài báo cũng dùng ô này làm ảnh ở khối "Báo chí nói về Tiến Nông". Khung ảnh khoảng 1040×560 px trên máy tính — nên dùng ảnh rộng ít nhất 2080 px.
  - name: cover_caption
    label: Chú thích ảnh đại diện
    type: string
  - name: body
    label: Nội dung bài viết
    type: rich-text
    options:
      format: markdown
  - name: album
    label: Album ảnh cuối bài
    component: photo
    list: true
  - name: album_link
    label: Đường dẫn xem toàn bộ album
    type: string
    description: Dán đường dẫn đầy đủ (https://…). Để trống nếu chưa có.
  - name: tags
    label: Chủ đề (thẻ)
    type: string
    list: true
    description: Bài hội thảo đầu bờ gắn thẻ "hội thảo" để hiện ở trang Nông dân Tiến Nông.
  - name: source
    label: 'Báo chí: Tên báo'
    type: string
    description: Chỉ điền khi chuyên mục là "Báo chí nói về Tiến Nông", ví dụ Diễn đàn Doanh nghiệp.
  - name: external_url
    label: 'Báo chí: Đường dẫn bài gốc'
    type: string
    description: Dán đường dẫn đầy đủ (https://…). Bấm vào bài sẽ mở bài gốc trên trang báo, không cần viết nội dung.
  - name: press_highlight
    label: 'Báo chí: Ưu tiên hiện trước'
    type: boolean
    description: Khối "Báo chí nói về Tiến Nông" ở cuối trang Tin tức hiện 3 bài, bấm "Xem thêm" để hiện hết. Bài được bật hiện trước, sau đó đến bài mới nhất.
