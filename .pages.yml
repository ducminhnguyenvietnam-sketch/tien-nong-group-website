# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Generated once from the page content files; edit by hand from now on.
media:
  input: public/uploads
  output: /uploads
settings:
  content:
    merge: true
components:
  photo:
    type: object
    fields:
    - name: src
      label: Ảnh
      type: image
      description: 'Cách dễ nhất: thay và căn ảnh ngay trên website — mở trang web kèm ?sua-anh ở cuối địa chỉ (ví dụ https://tiennong.com/?sua-anh)
        rồi bấm vào ảnh. Hoặc tải ảnh lên tại đây.'
    - name: focus
      label: Điểm căn ảnh
      type: string
      default: center
      description: 'Do chế độ sửa ảnh trên website tự điền (ví dụ "40% 25%"). Có thể ghi: center, top, bottom, left, right.'
    - name: zoom
      label: Phóng to (%)
      type: string
      default: '100'
      description: 100 = không phóng. Do chế độ sửa ảnh trên website tự điền.
    - name: alt
      label: Mô tả ảnh
      type: string
      description: Một câu mô tả nội dung ảnh (cho Google và người khiếm thị).
content:
- name: news
  label: Tin tức – bài viết
  type: collection
  path: src/content/news
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - category
    - date
    primary: title
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Tiêu đề
    type: string
    required: true
  - name: category
    label: Chuyên mục
    type: select
    required: true
    default: tn
    options:
      values:
      - value: tn
        label: Câu chuyện Tiến Nông
      - value: khcn
        label: Khoa học & Công nghệ
      - value: kt
        label: Kiến thức nông nghiệp
      - value: nd
        label: Nông dân & Mô hình hiệu quả
      - value: cd
        label: Tiến Nông vì cộng đồng & ESG
      - value: bc
        label: Báo chí nói về Tiến Nông
  - name: date
    label: Ngày đăng
    type: date
    description: Bài mới nhất hiện trước.
  - name: author
    label: Tác giả
    type: string
    default: Phòng Truyền thông
  - name: featured
    label: Ghim làm tin nổi bật
    type: boolean
    description: Tin nổi bật hiện ô lớn đầu trang Tin tức.
  - name: summary
    label: Tóm tắt (sapo)
    type: text
    description: Hiện ở danh sách tin và in đậm ở đầu bài.
  - name: cover
    label: Ảnh đại diện
    component: photo
    description: 'Ảnh ngang, rộng từ 2080 px, tệp DƯỚI 3 MB (lớn hơn sẽ báo lỗi "413") — website tự nén ảnh. Ảnh trên 3 MB: thu nhỏ ở squoosh.app
      (rộng 2400, chất lượng 85), hoặc lưu bài rồi mở bài trên web kèm ?sua-anh để tải ảnh gốc. Bài báo cũng dùng ô này làm ảnh ở khối "Báo chí nói về Tiến Nông".'
  - name: cover_caption
    label: Chú thích ảnh đại diện
    type: string
  - name: body
    label: Nội dung bài viết
    type: rich-text
    description: 'Chèn ảnh: gõ / rồi chọn Image → Upload (tệp dưới 3 MB, website tự nén). KHÔNG dán ảnh từ Word — ảnh dán từ Word không hiện trên
      web. Bài còn dòng mẫu "[Nội dung bài viết]" là bản nháp, chưa hiện trên web.'
    options:
      format: markdown
      categories:
      - image
  - name: album
    label: Album ảnh cuối bài
    component: photo
    list: true
  - name: album_link
    label: Đường dẫn xem toàn bộ album
    type: string
    description: Dán đường dẫn đầy đủ (https://…). Để trống nếu chưa có.
  - name: tags
    label: Chủ đề (thẻ)
    type: string
    list: true
    description: Bài hội thảo đầu bờ gắn thẻ "hội thảo" để hiện ở trang Nông dân Tiến Nông.
  - name: source
    label: 'Báo chí: Tên báo'
    type: string
    description: Chỉ điền khi chuyên mục là "Báo chí nói về Tiến Nông", ví dụ Diễn đàn Doanh nghiệp.
  - name: source_logo
    label: 'Báo chí: Logo của báo (tuỳ chọn)'
    description: Logo hiện trên ảnh bài. Để trống thì web tự dùng logo có sẵn (Nhân Dân, Tiền Phong, Diễn đàn Doanh nghiệp, Công Thương, Nông nghiệp và Môi trường); báo khác thì hiện tên báo.
    component: photo
  - name: external_url
    label: 'Báo chí: Đường dẫn bài gốc'
    type: string
    description: Dán đường dẫn đầy đủ (https://…). Bấm vào bài sẽ mở bài gốc trên trang báo, không cần viết nội dung.
  - name: press_highlight
    label: 'Báo chí: Ưu tiên hiện trước'
    type: boolean
    description: Khối "Báo chí nói về Tiến Nông" ở cuối trang Tin tức hiện 3 bài, bấm "Xem thêm" để hiện hết. Bài được bật hiện trước, sau đó
      đến bài mới nhất.
  - name: old_url
    label: Đường dẫn trên web cũ
    type: string
    description: Tự điền khi chuyển bài từ web cũ tiennong.vn. Người mở link cũ sẽ được chuyển sang bài này. Không cần sửa.
- name: products
  label: "Sản phẩm"
  type: collection
  path: src/content/products
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - name
    - line
    primary: name
    sort:
    - name
    default:
      sort: name
      order: asc
  fields:
  - name: name
    label: "Tên sản phẩm (đúng như trên bao bì)"
    type: string
    required: true
  - name: line
    label: "Dòng sản phẩm"
    type: select
    default: dd
    options:
      values:
      - value: cd
        label: Phân bón chuyên dùng
      - value: dd
        label: Phân bón đa dụng
      - value: hc
        label: Phân bón hữu cơ
      - value: cnc
        label: Phân bón công nghệ cao
  - name: order
    label: "Thứ tự hiển thị (dự phòng)"
    type: number
    description: "Không cần sửa: thứ tự hiển thị được sắp bằng cách kéo thả ở mục \"Sản phẩm – sắp xếp thứ tự (kéo thả)\". Số này chỉ dùng cho sản phẩm chưa có trong danh sách kéo thả."
  - name: featured
    label: "Đưa lên đầu"
    type: boolean
  - name: crops
    label: "Cây trồng phù hợp"
    type: string
    list: true
    description: "Dùng đúng tên trong bộ lọc: Lúa, Ngô, Cà phê, Cây ăn quả, Cây công nghiệp, Cây lâm nghiệp, Rau màu, Chè, Mía, Sắn, Lạc."
  - name: summary
    label: "Mô tả ngắn"
    type: text
  - name: front
    label: "Ảnh: Mặt trước bao (ảnh 3D nền trong suốt)"
    component: photo
    description: "PNG/WebP nền trong suốt, không viền."
  - name: back
    label: "Ảnh: Mặt sau bao"
    component: photo
  - name: granule
    label: "Ảnh: Hạt phân"
    component: photo
  - name: field
    label: "Ảnh: Ứng dụng thực tế 1 (ảnh đồng ruộng)"
    component: photo
    description: "Mục \"Ứng dụng\" trên trang sản phẩm hiện tối đa 3 ảnh đồng ruộng hoặc thực tế. Ảnh ngang, rộng ít nhất 1200 px."
  - name: field2
    label: "Ảnh: Ứng dụng thực tế 2"
    component: photo
  - name: field3
    label: "Ảnh: Ứng dụng thực tế 3"
    component: photo
  - name: type
    label: "Loại phân bón (theo chứng nhận hợp quy)"
    type: string
  - name: code
    label: "Mã số phân bón"
    type: string
  - name: tccs
    label: "Số TCCS"
    type: string
  - name: method
    label: "Phương thức sử dụng"
    type: string
  - name: pack
    label: "Quy cách / khối lượng tịnh"
    type: string
  - name: shelf_life
    label: "Hạn sử dụng"
    type: string
  - name: production
    label: "Ngày sản xuất, nơi sản xuất"
    type: string
  - name: standards
    label: "Tiêu chuẩn quản lý"
    type: string
  - name: npk
    label: "Chỉ số trên thẻ sản phẩm"
    type: object
    list: true
    fields:
    - name: value
      label: "Giá trị"
      type: string
    - name: unit
      label: "Chất"
      type: string
  - name: composition
    label: "Thành phần định lượng (theo chứng nhận hợp quy)"
    type: object
    list: true
    fields:
    - name: name
      label: "Chỉ tiêu"
      type: string
    - name: value
      label: "Mức công bố"
      type: string
    - name: method
      label: "Phương pháp thử"
      type: string
  - name: benefits
    label: "Tác dụng"
    type: text
    list: true
  - name: usage
    label: "Hướng dẫn sử dụng"
    type: object
    list: true
    fields:
    - name: title
      label: "Nhóm cây / giai đoạn"
      type: string
    - name: rate
      label: "Liều lượng"
      type: string
    - name: timing
      label: "Thời kỳ bón"
      type: text
    - name: method
      label: "Cách bón"
      type: text
    - name: note
      label: "Ghi chú"
      type: text
  - name: safety
    label: "Cảnh báo an toàn, bảo quản"
    type: string
    list: true
  - name: certificate
    label: "Tệp chứng nhận hợp quy (PDF)"
    type: file
  - name: tccs_pdf
    label: "Tệp Tiêu chuẩn cơ sở – TCCS (PDF)"
    type: file
    description: "Hiện nút \"Tải Tiêu chuẩn cơ sở (PDF)\" ở mục Thông tin pháp lý. Để trống nếu chưa có."
  - name: old_url
    label: "Đường dẫn trên web cũ"
    type: string
    description: "Tự điền khi chuyển từ web cũ, dùng để chuyển hướng link cũ. Không cần sửa."
- name: product-order
  label: "Sản phẩm – sắp xếp thứ tự (kéo thả)"
  type: file
  path: src/content/product-order.json
  format: json
  fields:
  - name: items
    label: "Thứ tự hiển thị sản phẩm"
    description: "Giữ biểu tượng ⋮⋮ ở đầu mỗi dòng rồi kéo lên/xuống để đổi thứ tự (thứ tự \"Bán nhiều nhất\" trên trang Sản phẩm). Sản phẩm mới thêm chưa có trong danh sách sẽ hiện sau cùng — bấm \"Add an entry\" và chọn sản phẩm để xếp chỗ cho nó. Bấm Save để lưu."
    type: reference
    list: true
    options:
      collection: products
      search: name
      value: "{path}"
      label: "{name}"
- name: pages
  label: Các trang
  type: group
  items:
  - name: trang_chu
    label: Trang chủ
    type: file
    path: src/content/pages/trang-chu.json
    format: json
    fields:
    - name: seo
      label: Tiêu đề tab trình duyệt & mô tả Google
      type: object
      fields:
      - name: title
        label: Tiêu đề trang
        type: string
        description: Hiện trên tab trình duyệt và kết quả Google. Để trống ở Trang chủ.
      - name: description
        label: Mô tả ngắn cho Google
        type: text
    - name: hero_slides
      label: 01 · Slide đầu trang (kéo để đổi thứ tự)
      type: object
      description: Mỗi slide là một ảnh lớn đầu trang chủ, tự chuyển sau 6 giây. Thêm slide bằng nút Add.
      list:
        collapsible:
          collapsed: true
          summary: '{fields.title}'
      fields:
      - name: eyebrow
        label: Dòng chữ nhỏ phía trên
        type: string
      - name: title
        label: Tiêu đề lớn
        type: string
      - name: text
        label: Mô tả
        type: text
      - name: button1_label
        label: Nút 1 – chữ
        type: string
      - name: button1_link
        label: Nút 1 – đường dẫn
        type: string
        description: Đường dẫn trong website (ví dụ /san-pham/) hoặc địa chỉ đầy đủ https://… Để trống nếu không cần.
      - name: button2_label
        label: Nút 2 – chữ
        type: string
      - name: button2_link
        label: Nút 2 – đường dẫn
        type: string
        description: Đường dẫn trong website (ví dụ /san-pham/) hoặc địa chỉ đầy đủ https://… Để trống nếu không cần.
      - name: show_text
        label: Hiện chữ trên ảnh
        type: boolean
        default: true
        description: Tắt nếu ảnh là poster đã thiết kế sẵn chữ (ví dụ ảnh chiến dịch sản phẩm).
      - name: image
        label: Ảnh slide
        component: photo
        description: Ảnh ngang, rộng ít nhất 2400 px. Có thể thay và căn ảnh ngay trên website với ?sua-anh.
    - name: s02_uy_tin
      label: 02 · Uy tín
      type: object
      fields:
      - name: t1
        label: 'Số liệu 1: 300.000+'
        type: string
      - name: t2
        label: 'Số liệu 1 – chú thích'
        type: string
      - name: t3
        label: 'Số liệu 2: 10.000'
        type: string
      - name: t4
        label: 'Số liệu 2 – chú thích'
        type: string
      - name: t5
        label: 'Số liệu 3: 200+'
        type: string
      - name: t6
        label: 'Số liệu 3 – chú thích'
        type: string
      - name: t7
        label: 'Số liệu 4: 650.000'
        type: string
      - name: t8
        label: 'Số liệu 4 – chú thích'
        type: string
      - name: t9
        label: 'Thành tựu 1 – tên (hiện chữ in hoa)'
        type: string
      - name: t10
        label: 'Thành tựu 1 – chú thích'
        type: string
      - name: t11
        label: 'Thành tựu 2 – tên'
        type: string
      - name: t12
        label: 'Thành tựu 2 – chú thích'
        type: string
      - name: t13
        label: 'Thành tựu 3 – tên'
        type: string
      - name: t14
        label: 'Thành tựu 3 – chú thích'
        type: string
      - name: t15
        label: 'Thành tựu 4 – tên'
        type: string
      - name: t16
        label: 'Thành tựu 4 – chú thích'
        type: string
      - name: t18
        label: 'Liên kết: Xem tất cả thành tựu →'
        type: string
      - name: img_award_1
        label: 'Ảnh thành tựu 1 (hiện phía trên chữ)'
        component: photo
        description: Ảnh nền trong suốt hoặc nền trắng, đặt vừa khung vuông.
      - name: img_award_2
        label: 'Ảnh thành tựu 2 (hiện phía trên chữ)'
        component: photo
        description: Ảnh nền trong suốt hoặc nền trắng, đặt vừa khung vuông.
      - name: img_award_3
        label: 'Ảnh thành tựu 3 (hiện phía trên chữ)'
        component: photo
        description: Ảnh nền trong suốt hoặc nền trắng, đặt vừa khung vuông.
      - name: img_award_4
        label: 'Ảnh thành tựu 4 (hiện phía trên chữ)'
        component: photo
        description: Ảnh nền trong suốt hoặc nền trắng, đặt vừa khung vuông.
      - name: years_value
        label: 'Số năm lớn (ví dụ 30+)'
        type: string
      - name: years_label
        label: 'Chữ dưới số năm (ví dụ Năm phát triển)'
        type: string
      - name: intro_image
        label: 'Ảnh lớn bên trái khối số liệu (cũng là ảnh bìa của video)'
        component: photo
        description: 'Ảnh ngang, nên rộng ít nhất 1200 px. Khi có video bên dưới, ảnh này là ảnh bìa; bấm vào sẽ phát video.'
      - name: intro_youtube
        label: 'Video YouTube cho ảnh này (để trống nếu không có)'
        type: string
        description: 'Dán đường dẫn YouTube, ví dụ https://www.youtube.com/watch?v=…'
      - name: intro_caption
        label: 'Chú thích nhỏ trên ảnh (để trống thì ẩn)'
        type: string
      - name: story_cta
        label: 'Nút dưới số liệu (ví dụ Khám phá câu chuyện Tiến Nông →)'
        type: string
      - name: story_link
        label: 'Đường dẫn của nút (ví dụ /ve-tien-nong/)'
        type: string
    - name: s03_khoa_hoc_cong_nghe
      label: 03 · Khoa học & Công nghệ
      type: object
      fields:
      - name: t1
        label: 'Nhãn in hoa: 01 · KHOA HỌC & CÔNG NGHỆ'
        type: string
      - name: t2
        label: 'Tiêu đề: Khoa học nền tảng, đồng ruộng là thước đo'
        type: string
      - name: t3
        label: 'Đoạn văn: Là doanh nghiệp Khoa học & Công nghệ đầu tiên …'
        type: text
      - name: img_rd_main_1
        label: 'Ảnh: Phòng thí nghiệm VILAS 1519 đang vận hành'
        component: photo
        description: Khung ảnh khoảng 576×420 px trên máy tính — nên dùng ảnh rộng ít nhất 1152 px.
      - name: t4
        label: 'Nhãn in hoa: R&D'
        type: string
      - name: t5
        label: 'Chữ đậm: Trung tâm Nghiên cứu Phát triển'
        type: string
      - name: t6
        label: 'Chữ: Công nghệ sản xuất, công nghệ sinh học'
        type: string
      - name: t7
        label: 'Nhãn in hoa: VILAS 1519'
        type: string
      - name: t8
        label: 'Chữ đậm: Phân tích & kiểm nghiệm chất lượng'
        type: string
      - name: t9
        label: 'Chữ: Kiểm soát chất lượng theo từng lô'
        type: string
      - name: t10
        label: 'Nhãn in hoa: ĐẤT – CÂY'
        type: string
      - name: t11
        label: 'Chữ đậm: Sức khỏe đất & dinh dưỡng'
        type: string
      - name: t12
        label: 'Chữ: Phân tích đất làm cơ sở xây dựng công thức'
        type: string
      - name: t13
        label: 'Nhãn in hoa: ỨNG DỤNG'
        type: string
      - name: t14
        label: 'Chữ đậm: Từ nghiên cứu đến đồng ruộng'
        type: string
      - name: t15
        label: 'Chữ: Mô hình trình diễn tại các vùng sản xuất trọng…'
        type: string
      - name: t16
        label: 'Chữ: [số]'
        type: string
      - name: t17
        label: 'Chữ: nhà khoa học & kỹ sư'
        type: string
      - name: t18
        label: 'Chữ: [số]'
        type: string
      - name: t19
        label: 'Chữ: đề tài nghiên cứu'
        type: string
      - name: t20
        label: 'Chữ: [số]'
        type: string
      - name: t21
        label: 'Chữ: mẫu đất phân tích/năm'
        type: string
      - name: t22
        label: 'Liên kết: Tìm hiểu Khoa học & Công nghệ →'
        type: string
      - name: slides
        label: Ảnh trình chiếu (tự chuyển, thêm/bớt tùy ý)
        description: Ảnh đầu tiên hiện trước. Nên 3–5 ảnh ngang. Ảnh “Phòng thí nghiệm” ở trên chỉ dùng khi danh sách này trống.
        component: photo
        list: true
    - name: s04_giai_phap_theo_doi_tuong
      label: 04 · Giải pháp theo đối tượng
      type: object
      fields:
