name: Deploy to GitHub Pages

# Preview copy on GitHub Pages (…github.io/tien-nong-group-website/). Free GitHub Pages only works while the
# repository is public, so both jobs skip themselves once it is private; the live site is then
# published to Mắt Bão by deploy-mat-bao.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      # Resized WebP copies of the photos (scripts/optimize-images.mjs) are kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/_img
          key: img-${{ hashFiles('public/uploads/**', 'public/images/**', 'scripts/optimize-images.mjs') }}
          restore-keys: img-
      - run: npm run check:content
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # The on-site photo editor commits to this repository.
          PUBLIC_GITHUB_REPO: ${{ github.repository }}
          # Where the lead forms send their data (Settings → Secrets and variables → Actions → Variables).
          # Empty = the forms are replaced by call / Zalo / email buttons.
          PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          # The live site (tiennong.com) is served from here. NOINDEX = 1 hides it from Google again.
          PUBLIC_PREVIEW: ${{ vars.NOINDEX }}
          # Google Tag Manager container (GA4, Google Ads, Meta / TikTok pixels) and Search Console tag.
          PUBLIC_GTM_ID: ${{ vars.GTM_ID }}
          PUBLIC_GSC_VERIFY: ${{ vars.GSC_VERIFY }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
