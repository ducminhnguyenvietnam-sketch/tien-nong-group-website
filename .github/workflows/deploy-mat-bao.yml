name: Deploy to tiennong.com (Mắt Bão)

# Builds the site for https://tiennong.com and uploads it to the Mắt Bão hosting over FTPS (encrypted FTP).
# Runs after every change on main — including each save in Pages CMS — and can be started by hand
# (Actions → "Deploy to tiennong.com (Mắt Bão)" → Run workflow).
#
# Nothing is uploaded unless the build and the content check pass, so a broken change never reaches the
# live site: it keeps the last good version.
#
# Settings → Secrets and variables → Actions:
#   Secrets   FTP_SERVER    FTP host given by Mắt Bão (e.g. ftp.tiennong.com)
#             FTP_USERNAME  a separate FTP account that can only reach the web folder
#             FTP_PASSWORD  its password
#   Variables SITE_URL      https://tiennong.com            (optional, this is the default)
#             FTP_DIR       public_html/                     (optional, the folder the site lives in)
#             FORM_ENDPOINT                                  (optional, as in deploy.yml)
#             FTP_SECURITY  strict                           (optional; "loose" only if the certificate check fails)
#             GTM_ID        GTM-XXXXXXX                      (optional: Google Tag Manager — GA4, Google Ads, pixels)
#             GSC_VERIFY                                     (optional: Google Search Console HTML-tag code)
#             NOINDEX       1                                (optional: live but hidden from Google, e.g. soft launch)
#
# Every action below is pinned to an exact commit (the version is in the comment), so a hijacked
# release tag of a third-party action cannot run code that sees the FTP password. Dependabot
# (.github/dependabot.yml) proposes updates as pull requests.
# While FTP_SERVER is empty the workflow builds nothing and just says so.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mat-bao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - if: env.HAS_FTP != 'true'
        run: echo "::notice::Chưa khai báo FTP_SERVER / FTP_USERNAME / FTP_PASSWORD nên chưa đăng lên Mắt Bão."
      - if: env.HAS_FTP == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.HAS_FTP == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_FTP == 'true'
        run: npm ci
      - if: env.HAS_FTP == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/_img
          key: img-${{ hashFiles('public/uploads/**', 'public/images/**', 'scripts/optimize-images.mjs') }}
          restore-keys: img-
      - if: env.HAS_FTP == 'true'
        run: npm run check:content
      - if: env.HAS_FTP == 'true'
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://tiennong.com' }}
          BASE_PATH: /
          PUBLIC_GITHUB_REPO: ${{ github.repository }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          # Google Tag Manager container (GA4, Google Ads, Meta / TikTok pixels) and Search Console tag.
          PUBLIC_GTM_ID: ${{ vars.GTM_ID }}
          PUBLIC_GSC_VERIFY: ${{ vars.GSC_VERIFY }}
          # NOINDEX = 1: the site is live but kept out of Google (soft launch on a temporary domain).
          PUBLIC_PREVIEW: ${{ vars.NOINDEX }}
      # Only changed files are sent (the action keeps a small state file on the server, hidden by .htaccess).
      - if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # "strict" checks the server's TLS certificate, so the password can only go to the real host.
          # If Mắt Bão's certificate is issued for another host name, use that name as FTP_SERVER
          # (best), or set the variable FTP_SECURITY to "loose".
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
