# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Generated once from the page content files; edit by hand from now on.
media:
  input: public/uploads
  output: /uploads
settings:
  content:
    merge: true
components:
  photo:
    type: object
    fields:
    - name: src
      label: Ảnh
      type: image
      description: 'Cách dễ nhất: thay và căn ảnh ngay trên website — mở https://ducminhnguyenvietnam-sketch.github.io/tien-nong-group-website/?sua-anh
        rồi bấm vào ảnh. Hoặc tải ảnh lên tại đây.'
    - name: focus
      label: Điểm căn ảnh
      type: string
      default: center
      description: 'Do chế độ sửa ảnh trên website tự điền (ví dụ "40% 25%"). Có thể ghi: center, top, bottom, left, right.'
    - name: zoom
      label: Phóng to (%)
      type: string
      default: '100'
      description: 100 = không phóng. Do chế độ sửa ảnh trên website tự điền.
    - name: alt
      label: Mô tả ảnh
      type: string
      description: Một câu mô tả nội dung ảnh (cho Google và người khiếm thị).
content:
- name: news
  label: Tin tức – bài viết
  type: collection
  path: src/content/news
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - category
    - date
    primary: title
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Tiêu đề
    type: string
    required: true
  - name: category
    label: Chuyên mục
    type: select
    required: true
    default: tn
    options:
      values:
      - value: tn
        label: Câu chuyện Tiến Nông
      - value: khcn
        label: Khoa học & Công nghệ
      - value: kt
        label: Kiến thức nông nghiệp
      - value: nd
        label: Nông dân & Mô hình hiệu quả
      - value: cd
        label: Tiến Nông vì cộng đồng & ESG
      - value: bc
        label: Báo chí nói về Tiến Nông
  - name: date
    label: Ngày đăng
    type: date
    description: Bài mới nhất hiện trước.
  - name: author
    label: Tác giả
    type: string
    default: Phòng Truyền thông
  - name: featured
    label: Ghim làm tin nổi bật
    type: boolean
    description: Tin nổi bật hiện ô lớn đầu trang Tin tức.
  - name: summary
    label: Tóm tắt (sapo)
    type: text
    description: Hiện ở danh sách tin và in đậm ở đầu bài.
  - name: cover
    label: Ảnh đại diện
    component: photo
    description: Bài báo cũng dùng ô này làm ảnh ở khối "Báo chí nói về Tiến Nông". Khung ảnh khoảng 1040×560 px trên máy tính — nên dùng ảnh
      rộng ít nhất 2080 px.
  - name: cover_caption
    label: Chú thích ảnh đại diện
    type: string
  - name: body
    label: Nội dung bài viết
    type: rich-text
    options:
      format: markdown
  - name: album
    label: Album ảnh cuối bài
    component: photo
    list: true
  - name: album_link
    label: Đường dẫn xem toàn bộ album
    type: string
    description: Dán đường dẫn đầy đủ (https://…). Để trống nếu chưa có.
  - name: tags
    label: Chủ đề (thẻ)
    type: string
    list: true
    description: Bài hội thảo đầu bờ gắn thẻ "hội thảo" để hiện ở trang Nông dân Tiến Nông.
  - name: source
    label: 'Báo chí: Tên báo'
    type: string
    description: Chỉ điền khi chuyên mục là "Báo chí nói về Tiến Nông", ví dụ Diễn đàn Doanh nghiệp.
  - name: external_url
    label: 'Báo chí: Đường dẫn bài gốc'
    type: string
    description: Dán đường dẫn đầy đủ (https://…). Bấm vào bài sẽ mở bài gốc trên trang báo, không cần viết nội dung.
  - name: press_highlight
    label: 'Báo chí: Ưu tiên hiện trước'
    type: boolean
    description: Khối "Báo chí nói về Tiến Nông" ở cuối trang Tin tức hiện 3 bài, bấm "Xem thêm" để hiện hết. Bài được bật hiện trước, sau đó
      đến bài mới nhất.
  - name: old_url
    label: Đường dẫn trên web cũ
    type: string
    description: Tự điền khi chuyển bài từ web cũ tiennong.vn. Người mở link cũ sẽ được chuyển sang bài này. Không cần sửa.
- name: products
  label: "Sản phẩm"
  type: collection
  path: src/content/products
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - name
    - line
    - order
    primary: name
    sort:
    - order
    - name
    default:
      sort: order
      order: asc
  fields:
  - name: name
    label: "Tên sản phẩm (đúng như trên bao bì)"
    type: string
    required: true
  - name: line
    label: "Dòng sản phẩm"
    type: select
    default: dd
    options:
      values:
      - value: cd
        label: Phân bón chuyên dùng
      - value: dd
        label: Phân bón đa dụng
      - value: hc
        label: Phân bón hữu cơ
      - value: cnc
        label: Phân bón công nghệ cao
  - name: order
    label: "Thứ tự hiển thị"
    type: number
    description: "Số nhỏ hiện trước (\"Bán nhiều nhất\" trên trang Sản phẩm)."
  - name: featured
    label: "Đưa lên đầu"
    type: boolean
  - name: crops
    label: "Cây trồng phù hợp"
    type: string
    list: true
    description: "Dùng đúng tên trong bộ lọc: Lúa, Ngô, Cà phê, Cây ăn quả, Cây công nghiệp, Cây lâm nghiệp, Rau màu, Chè, Mía, Sắn, Lạc."
  - name: summary
    label: "Mô tả ngắn"
    type: text
  - name: front
    label: "Ảnh: Mặt trước bao (ảnh 3D nền trong suốt)"
    component: photo
    description: "PNG/WebP nền trong suốt, không viền."
  - name: back
    label: "Ảnh: Mặt sau bao"
    component: photo
  - name: granule
    label: "Ảnh: Hạt phân"
    component: photo
  - name: field
    label: "Ảnh: Ứng dụng thực tế"
    component: photo
  - name: type
    label: "Loại phân bón (theo chứng nhận hợp quy)"
    type: string
  - name: code
    label: "Mã số phân bón"
    type: string
  - name: tccs
    label: "Số TCCS"
    type: string
  - name: method
    label: "Phương thức sử dụng"
    type: string
  - name: pack
    label: "Quy cách / khối lượng tịnh"
    type: string
  - name: shelf_life
    label: "Hạn sử dụng"
    type: string
  - name: production
    label: "Ngày sản xuất, nơi sản xuất"
    type: string
  - name: standards
    label: "Tiêu chuẩn quản lý"
    type: string
  - name: npk
    label: "Chỉ số trên thẻ sản phẩm"
    type: object
    list: true
    fields:
    - name: value
      label: "Giá trị"
      type: string
    - name: unit
      label: "Chất"
      type: string
  - name: composition
    label: "Thành phần định lượng (theo chứng nhận hợp quy)"
    type: object
    list: true
    fields:
    - name: name
      label: "Chỉ tiêu"
      type: string
    - name: value
      label: "Mức công bố"
      type: string
    - name: method
      label: "Phương pháp thử"
      type: string
  - name: benefits
    label: "Tác dụng"
    type: text
    list: true
  - name: usage
    label: "Hướng dẫn sử dụng"
    type: object
    list: true
    fields:
    - name: title
      label: "Nhóm cây / giai đoạn"
      type: string
    - name: rate
      label: "Liều lượng"
      type: string
    - name: timing
      label: "Thời kỳ bón"
      type: text
    - name: method
      label: "Cách bón"
      type: text
    - name: note
      label: "Ghi chú"
      type: text
  - name: safety
    label: "Cảnh báo an toàn, bảo quản"
    type: string
    list: true
  - name: certificate
    label: "Tệp chứng nhận hợp quy (PDF)"
    type: file
  - name: old_url
    label: "Đường dẫn trên web cũ"
    type: string
    description: "Tự điền khi chuyển từ web cũ, dùng để chuyển hướng link cũ. Không cần sửa."
- name: pages
  label: Các trang
  type: group
  items:
  - name: trang_chu
    label: Trang chủ
    type: file
    path: src/content/pages/trang-chu.json
    format: json
    fields:
